[project]
name = "tempo-lock"
version = "0.1.0"
description = "Straighten a live-drifting track onto a steady tempo grid"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "scipy",
    "soundfile>=0.12",       # bundles libsndfile with MP3 read/write
    "librosa>=0.10",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "beat-this>=1.1",        # beat tracker (Beat This!, CPJKU)
    "torch",
    "torchaudio",
]

[project.scripts]
tempolock = "tempolock.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "httpx",                 # fastapi's TestClient needs it
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tempolock"]

# The default torch wheels bundle CUDA and are ~10x bigger. This app is CPU-only
# everywhere it runs (a laptop, a fly.io shared VM), so pull from PyTorch's CPU index.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.ruff.lint.flake8-bugbear]
# FastAPI's whole dependency-injection idiom is a call in an argument default (B008).
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]
